name: Build APK

# APKビルド専用ワークフロー。
#
# ローカルの開発サンドボックスはネットワークegressポリシーにより
# dl.google.com（Android SDK cmdline-toolsの取得元）へアクセスできず、
# `flutter build apk` を実行できない。GitHub Actionsのホスト型ランナーは
# その制約を受けないため、APKビルドはここで行う。
#
# main へのマージ時に自動ビルドし、手動実行（workflow_dispatch）でも
# いつでも起動できるようにしている。

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

# GITHUB_TOKENの既定権限（リポジトリ設定次第でread-write相当になり得る）に
# 依存せず、このワークフローが実際に必要とする最小権限を明示する
# （app-privacy-security チェックリスト: CI/CDのpermissions最小化）。
# checkout・pub get・analyze・test・build・artifact upload のいずれも
# リポジトリ内容の読み取りのみで完結し、書き込み権限は不要。
permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Rename APK to match distribution naming convention
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/ririkan-app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ririkan-app-release
          path: dist/ririkan-app-release.apk
          retention-days: 30
